services:
  alpha-engine-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: quant-alpha-engine:latest
    container_name: quant-alpha-engine-api
    ports:
      - "8000:8000"
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./results:/app/results
      - alpha-cache:/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  alpha-cache:
